collect:
  hours: 0.15
  workers_per_gpu: 1
  num_envs: 4
  frames: 1500
  seed_base: 100000
  foliage: [0.6]
  apples: [35]
  max_decisions: 4
  action_probs: [0.2, 0.2, 0.2, 0.15, 0.15, 0.1]

train:
  variants: [full, no_action]
  seeds: [0]
  epochs: 2
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  width: 128
  runs_per_gpu: 1
  max_minutes: 5

eval:
  hours: 0.15
  workers_per_gpu: 1
  num_envs: 4
  frames: 900
  seed_base: 900000
  main_seeds: 1
  sweep_seeds: 1
  keep_obs: 8

phase2:
  train:
    variants: [vjepa]
    seeds: [0]
  eval:
    hours: 0.15
